name: Sync Overleaf CV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  sync-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync PDF from Overleaf
        env:
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_GIT_URL: ${{ secrets.OVERLEAF_GIT_URL }}
          OVERLEAF_CV_PDF_PATH: ${{ secrets.OVERLEAF_CV_PDF_PATH }}
          LOCAL_CV_PDF_PATH: assets/pdf/Yihong_Zhou_CV.pdf
        run: _scripts/sync_overleaf_cv.sh

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/pdf/Yihong_Zhou_CV.pdf; then
            echo "No CV update detected."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/Yihong_Zhou_CV.pdf
          git commit -m "chore(cv): sync latest CV from Overleaf"
          git push
